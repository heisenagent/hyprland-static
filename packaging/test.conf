# Smoke-test config for CI: exercises the option types a typical setup uses.
monitor = , preferred, auto, 1
general {
    gaps_in = 4
    gaps_out = 0
    border_size = 0
    resize_on_border = true
    layout = master
}
master {
    new_status = slave
    orientation = top
    mfact = 0.70
}
group {
    groupbar {
        font_size = 14
        col.active = rgb(5588ff)
    }
}
animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 1.44, easeOutQuint
}
misc {
    background_color = rgb(111188)
    on_focus_under_fullscreen = 1
}
input {
    kb_options = caps:escape
    follow_mouse = 2
}
workspace = 1, monitor:none
bind = SUPER, Q, killactive,
bind = SUPER CTRL, K, movewindoworgroup, u
bind = SUPER, semicolon, layoutmsg, addmaster
bindm = SUPER, mouse:273, resizewindow
windowrule {
    name = test-rule
    match:class = ^test$
    no_initial_focus = true
}
