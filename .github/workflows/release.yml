name: Release

# Pushing a tag builds the .deb and publishes a GitHub *pre-release* with it
# attached.  Install and test it, then promote it to a full release (Edit ->
# untick "Set as a pre-release"), so other users get it.
#
# The tag must be "v" plus the Hyprland submodule's version (e.g. v0.56.2,
# from src/Hyprland/VERSION, which matches Hyprland's release tag), optionally
# followed by -N, which becomes the Debian revision (v0.56.2-2 -> 0.56.2-2).
# scripts/next-release.sh prints the next tag to use.
#
# Releases are immutable once published, so the package must be attached
# when the release is created: create releases by pushing a tag, not in
# GitHub's web UI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb and publish a pre-release
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check the tag against the Hyprland submodule
        id: version
        run: |
          hyprland=v$(cat src/Hyprland/VERSION)
          if [ "$TAG" = "$hyprland" ]; then
            revision=1
          elif [[ "$TAG" =~ ^${hyprland//./\\.}-([1-9][0-9]*)$ ]]; then
            revision=${BASH_REMATCH[1]}
          else
            echo "::error::Tag $TAG doesn't match the Hyprland submodule ($hyprland or $hyprland-N)"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      - name: Build, test and package
        env:
          DEB_REVISION: ${{ steps.version.outputs.revision }}
        run: ./build.sh

      - uses: ./.github/actions/save-caches
        if: always()

      # gh creates the release as a draft, uploads the package and then
      # publishes it, so the package is part of the immutable release.  The
      # notes list every static dependency (scripts/release_notes.py), followed
      # by GitHub's list of merged pull requests.
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/*.deb --verify-tag --prerelease \
            --title "Hyprland $(cat src/Hyprland/VERSION) for Ubuntu 26.04 ($TAG)" \
            --notes-file out/release-notes.md --generate-notes

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: logs/
