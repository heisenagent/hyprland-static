name: Release

# Publishing a GitHub release builds the .deb for that tag and attaches it.
# The tag must be the Hyprland submodule's tag (e.g. v0.56.2), optionally
# followed by -N, which becomes the Debian revision (v0.56.2-2 -> 0.56.2-2).

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check the tag against the Hyprland submodule
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          hyprland=$(git -C src/Hyprland describe --tags --exact-match)
          if [ "$TAG" = "$hyprland" ]; then
            revision=1
          elif [[ "$TAG" =~ ^${hyprland//./\\.}-([1-9][0-9]*)$ ]]; then
            revision=${BASH_REMATCH[1]}
          else
            echo "::error::Tag $TAG doesn't match the Hyprland submodule ($hyprland or $hyprland-N)"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      - name: Build, test and package
        env:
          DEB_REVISION: ${{ steps.version.outputs.revision }}
        run: ./build.sh

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/*.deb --clobber

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
